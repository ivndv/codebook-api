# codebook-api CI: lint (ruff) y tests (pytest)
name: codebook-api CI

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref para no gastar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: lint y formato con ruff (falla si hay problemas)
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Python con caché de pip e instala dependencias
      - name: Setup Python env
        uses: ./.github/actions/setup
        with:
          python-version: "3.15.1"

      # 3. Verifica lint y formato
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  # Job 2: pruebas con pytest — paralelo a lint
  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Python con caché de pip e instala dependencias
      - name: Setup Python env
        uses: ./.github/actions/setup
        with:
          python-version: "3.15.1"

      # 3. Ejecuta los tests (Groq va mockeado: no gasta cuota)
      - name: Run tests
        run: pytest -q
