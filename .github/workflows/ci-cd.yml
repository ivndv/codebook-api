# codebook-api CI: lint (ruff) y tests (pytest)
name: codebook-api CI

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref para no gastar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: lint y formato con ruff (falla si hay problemas)
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Python con caché de pip
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
          cache: pip

      # 3. Instala dependencias de desarrollo
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 4. Verifica lint y formato
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  # Job 2: pruebas con pytest — paralelo a lint
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Python con caché de pip
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
          cache: pip

      # 3. Instala dependencias de desarrollo
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 4. Ejecuta los tests (Groq va mockeado: no gasta cuota)
      - name: Run tests
        run: pytest -q

  # Job 3: despliegue en el VPS con Dokploy (solo push a main)
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Dokploy API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            curl -X POST 'http://localhost:3000/api/application.deploy' \
              -H 'Content-Type: application/json' \
              -H 'x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}' \
              -d '{"applicationId": "${{ secrets.DOKPLOY_CODEBOOK_API_ID }}"}'
